
name: Wind Alert Bot

on:
  schedule:
    # Cada 2 horas, entre las 06:00 y 20:00 UTC (ajusta a tu franja horaria/necesidad)
    - cron: "0 6-20/2 * * *"
  workflow_dispatch: {}   # te permite lanzarlo manualmente desde GitHub para probar

jobs:
  check-wind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run wind alert bot
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python wind_alert_bot.py
